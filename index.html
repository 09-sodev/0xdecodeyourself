<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="0xDecodeyourself gives you 1:1 sessions with a senior marketing and brand executive, TEDx speaker, and published author who has actually done it">
    <meta name="keywords" content="personalcoaching personal branding digital identity college coaching mentoring">
    <title>0xdecodeyourself | Career Clarity for Recent Graduates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .badge {
            display: inline-block;
            border: 1px solid #D4860F;
            border-radius: 20px;
            padding: 8px 16px;
            margin-bottom: 40px;
            font-size: 12px;
            color: #D4860F;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 100px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1;
        }

        .gold {
            color: #D4860F;
        }

        .white {
            color: #fff;
        }

        p {
            font-size: 16px;
            color: #999;
            margin-bottom: 40px;
            letter-spacing: 0.3px;
        }

        .cta {
            display: inline-block;
            background: linear-gradient(135deg, #D4860F, #C84A32);
            color: white;
            padding: 12px 32px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cta:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(212, 134, 15, 0.3);
        }

        footer {
            position: fixed;
            bottom: 20px;
            font-size: 12px;
            color: #666;
            letter-spacing: 0.3px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 60px;
            }
            
            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">⬥ coming soon</div>
        
        <h1>
            <span class="gold">0x</span><span class="white">decodeyourself</span>
        </h1>
        
        <p>Career coaching for college students & recent grads who want to build something real.</p>
        
        <p style="color: #D4860F; margin-top: 60px; font-size: 14px;">hiangeloddo@gmail.com</p>
    </div>

    <footer>
        © 2026 - All Rights Reserved
    </footer>
</body>
</html>
